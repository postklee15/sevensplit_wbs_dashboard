name: CS Slack alerts

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Resend even if already sent today"
        required: false
        default: "false"

jobs:
  cs-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_CS_DATABASE_ID: ${{ secrets.NOTION_CS_DATABASE_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Run weekday 11:00 KST CS Slack alerts
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: |
          export FIRESTORE_TOKEN
          FIRESTORE_TOKEN="$(gcloud auth print-access-token)"
          npx --yes tsx scripts/run-cs-alerts.ts
