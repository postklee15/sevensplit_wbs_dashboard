name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_CS_DATABASE_ID: ${{ secrets.NOTION_CS_DATABASE_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      WBS_TEST_PASSWORD: ${{ secrets.WBS_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Write production env
        run: |
          printf 'NOTION_TOKEN=%s\nNOTION_DATABASE_ID=%s\nNOTION_CS_DATABASE_ID=%s\nSLACK_BOT_TOKEN=%s\nWBS_TEST_PASSWORD=%s\n' \
            "$NOTION_TOKEN" \
            "${NOTION_DATABASE_ID:-37c1559b-095a-80f1-af80-e0be81606fe9}" \
            "${NOTION_CS_DATABASE_ID:-2aa1559b-095a-8098-b648-f7e7769c49a2}" \
            "$SLACK_BOT_TOKEN" \
            "$WBS_TEST_PASSWORD" \
            > .env.sevensplit-wbs-dashboard
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Ensure Firestore database
        continue-on-error: true
        run: |
          npx -y firebase-tools@latest firestore:databases:create "(default)" \
            --location=asia-northeast3 --edition=standard \
            --project sevensplit-wbs-dashboard --non-interactive || true
      - name: Deploy Firestore rules
        run: |
          npx -y firebase-tools@latest deploy --only firestore \
            --project sevensplit-wbs-dashboard --non-interactive
      - name: Deploy to Firebase Hosting
        run: |
          npx -y firebase-tools@latest experiments:enable webframeworks
          npx -y firebase-tools@latest deploy --only hosting --project sevensplit-wbs-dashboard --non-interactive --force
